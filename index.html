    .explanation { margin-top: 15px; padding: 12px; background: #263238; border-left: 4px solid #00bcd4; border-radius: 4px; font-size: 14px; display: none; }
    .nav-btns { display: flex; justify-content: space-between; margin-top: 25px; }

  let currentQuestion = 0;
  let score = 0;
  let answered = false;

  const questionCounter = document.getElementById("question-counter");
  const scoreKeeper = document.getElementById("score-keeper");
  const questionText = document.getElementById("question-text");
  const optionsContainer = document.getElementById("options-container");
  const explanationBox = document.getElementById("explanation-box");
  const prevBtn = document.getElementById("prev-btn");
  const nextBtn = document.getElementById("next-btn");

  function loadQuestion() {
    answered = false;
    explanationBox.style.display = "none";
    nextBtn.disabled = true;
    prevBtn.disabled = currentQuestion === 0;

    questionCounter.innerText = `Question ${currentQuestion + 1} of ${quizData.length}`;
    scoreKeeper.innerText = `Score: ${score}`;

    const q = quizData[currentQuestion];
    questionText.innerText = q.question;
    optionsContainer.innerHTML = "";

    q.options.forEach((opt, index) => {
      const div = document.createElement("div");
      div.className = "option";
      div.innerText = opt;
      div.onclick = () => selectOption(index, div);
      optionsContainer.appendChild(div);
    });
  }

  function selectOption(selectedIndex, element) {
    if (answered) return;
    answered = true;

    const q = quizData[currentQuestion];
    const options = optionsContainer.children;

    if (selectedIndex === q.answer) {
      element.classList.add("correct");
      score++;
      scoreKeeper.innerText = `Score: ${score}`;
    } else {
      element.classList.add("wrong");
      options[q.answer].classList.add("correct");
    }

    // Show correct explanation badge or message hint
    explanationBox.style.display = "block";
    explanationBox.innerHTML = `<span class="badge ${selectedIndex === q.answer ? 'badge-correct' : 'badge-wrong'}">${selectedIndex === q.answer ? 'Correct!' : 'Incorrect!'}</span> The correct answer is option <strong>${String.fromCharCode(65 + q.answer)}</strong>.`;

    nextBtn.disabled = false;
  }

  function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < quizData.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function prevQuestion() {
    if (currentQuestion > 0) {
      currentQuestion--;
      loadQuestion();
    }
  }

  function showResults() {
    document.querySelector(".quiz-container").innerHTML = `
      <h2 style="text-align: center; color: #4caf50;">Quiz Completed! 🎉</h2>
      <p style="text-align: center; font-size: 20px; margin: 20px 0;">Your final score is <strong>${score} / ${quizData.length}</strong> (${((score/quizData.length)*100).toFixed(1)}%)</p>
      <button style="display: block; width: 100%; margin-top: 20px;" onclick="location.reload()">Restart Quiz</button>
    `;
  }

  // Initialize quiz load
  loadQuestion();
</script>
